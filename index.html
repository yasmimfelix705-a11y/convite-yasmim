<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite 15 Anos Yasmim</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ==========================
     TELA DO ENVELOPE
========================== -->


<div id="tela-envelope" class="tela-envelope">


    <img

    src="imagens/file_000000002c34720eb653895a2e8ebbc9.png"

    class="envelope"

    onclick="abrirConvite()"

    alt="Envelope do convite">


</div>







<!-- ==========================
     TELA DO CONVITE
========================== -->


<div id="tela-convite" class="tela-convite">



    <img

    src="imagens/file_00000000c2f8720e9bc3ba3cec583958.png"

    class="convite"

    alt="Convite de 15 anos">





    <!-- ÁREAS TRANSPARENTES DE CLIQUE -->


    <button

    class="circulo-presentes"

    onclick="listaPresentes()"

    aria-label="Lista de presentes">

    </button>





    <button

    class="circulo-local"

    onclick="verLocal()"

    aria-label="Local da festa">

    </button>





    <button

    class="circulo-confirmar"

    onclick="confirmarPresenca()"

    aria-label="Confirmar presença">

    </button>



</div>







<script src="script.js"></script>


</body>


</html>
